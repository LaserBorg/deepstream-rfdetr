source:
  type: "hls"      # "hls" | "file" | "csi" (CSI is not implemented yet)
  hls_uri: "https://stream-5gw.1000eyes.de/cupertino/hamDDFBCE.stream/playlist.m3u8"
  file_uri: "file:///opt/nvidia/deepstream/deepstream/samples/streams/sample_1080p_h264.mp4"      # Use a file:// URI when type is "file"

model:
  size: "rfdetr-medium"       # rfdetr-nano | rfdetr-small | rfdetr-medium | rfdetr-large
  precision: "fp16"           # fp16 | fp32
  class_ids: [1, 3, 6, 5]      # COCO IDs to keep: person, car, bus, airplane; use [] to keep all classes

tracking:
  algorithm: "NvSORT"         # NvSORT | IOU | NvDCF | NvDeepSORT
  detector_threshold: 0.5      # RF-DETR detections below this confidence are discarded
  min_detector_confidence: 0.5 # Native tracker input confidence floor
  min_iou_diff_new_target: 0.5780
  min_tracker_confidence: 0.8216
  probation_age: 5
  max_shadow_tracking_age: 26
  min_matching_iou: 0.2159

csi_camera:
  sensor_id: 0
  width: 1920
  height: 1080
  fps: 30
  flip_method: 2  # 0: none, 2: rotate 180

streammux:
  batch_size: 1
  width: 640
  height: 360

runtime:
  hls_segment_duration_seconds: 4
  file_segment_duration_seconds: 60
  capture_duration_seconds: 120
  grace_seconds: 10
  identity_sync: true       # Pace frames to timestamps; set false for fast file processing

outputs:
  rtsp:
    port: 8554
    mount_point: "/deepstream-rfdetr"
    encoder:
      width: 640
      height: 360
      bitrate_mbps: 2
      iframeinterval: 30
      profile: 0

mqtt:
  topic: "vision/detections"
  brokers:
    - name: "mosquitto"
      host: "192.168.1.10"
      port: 1883
      tls: false
      ca_cert: "mqtt/ca.crt"
      username: ${SYNOLOGY_MQTT_USER}
      password: ${SYNOLOGY_MQTT_PASSWORD}
    - name: "hivemq"
      host: "ab8139df41f643a5a6cf4d54288bc8f6.s1.eu.hivemq.cloud"
      port: 8883
      tls: true
      username: ${HIVEMQ_MQTT_USER}
      password: ${HIVEMQ_MQTT_PASSWORD}
